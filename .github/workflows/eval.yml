# Exercise 7.3 — quality gate: chạy eval trên golden dataset, accuracy < 85% thì job fail.
# Đặt "quality-gate / eval" là required status check trong branch protection của main
# để PR không merge được khi job fail.
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        # MOCK_ERROR_RATE=0 và MOCK_SLOW_RATE=0: gate chỉ đo chất lượng câu trả lời,
        # không để lỗi upstream ngẫu nhiên của mock làm job fail chập chờn.
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 PORT=8000 python app.py > agent.log 2>&1 &
          for i in $(seq 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "agent không lên sau 30s"; cat agent.log; exit 1

      - name: Run eval (quality gate)
        # run_eval.py trả exit code 1 khi accuracy < --min-accuracy → step fail → job fail
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out reports/eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
          if-no-files-found: ignore
