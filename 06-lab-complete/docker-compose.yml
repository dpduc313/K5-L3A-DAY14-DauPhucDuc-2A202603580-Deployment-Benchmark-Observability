# Agent + Redis bằng một lệnh (tiêu chí 2):
#   cp .env.example .env   # điền AGENT_API_KEY
#   docker compose up --build
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # không có .env vẫn chạy (khi đó /ask trả 401 vì chưa có key)
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # rate limit / chi phí còn sau khi Redis restart
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
