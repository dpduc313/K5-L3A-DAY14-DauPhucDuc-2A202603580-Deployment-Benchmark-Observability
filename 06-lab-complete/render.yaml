# Render Blueprint (tiêu chí 12) — phương án thay Railway, không dùng để deploy chính.
# Khi tạo Blueprint, trỏ "Blueprint path" tới 06-lab-complete/render.yaml.
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue                   # Redis-compatible (Render Key Value)
    name: agent-redis
    plan: free
    ipAllowList: []                  # chỉ service trong cùng tài khoản truy cập được
