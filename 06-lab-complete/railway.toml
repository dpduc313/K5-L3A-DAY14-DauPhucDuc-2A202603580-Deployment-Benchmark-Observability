# Railway (tiêu chí 12). Deploy: cd 06-lab-complete && railway up
# Port: Railway cấp biến PORT, CMD trong Dockerfile lắng nghe theo ${PORT}.
# Biến môi trường (đặt trên dashboard / `railway variables`, KHÔNG ghi ở đây):
#   AGENT_API_KEY, REDIS_URL=${{Redis.REDIS_URL}}, ENVIRONMENT=production,
#   RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, MONTHLY_BUDGET_USD

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
